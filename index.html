<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Paul - Edición Locura</title>
  <style>
    :root {
      --bg-color: #70c5ce; 
      --ground-color: #ded895;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #121212; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none; 
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 400px; 
      height: 100%;
      max-height: 600px;
      background-color: var(--bg-color);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #score-display {
      font-size: 4rem;
      font-weight: bold;
      color: var(--text-color);
      margin-top: 15%;
      text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      z-index: 10;
      transition: color 0.2s, transform 0.2s;
    }

    #score-display.powerup {
      color: #facc15;
      transform: scale(1.2);
    }

    /* TEXTO DEL SUPER PODER FLOTANTE */
    #powerup-text {
      position: absolute;
      top: 35%;
      font-size: 1.8rem;
      font-weight: 900;
      color: #facc15;
      text-shadow: 3px 3px 0 #000;
      text-align: center;
      z-index: 20;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s ease-out;
    }

    #powerup-text.show {
      opacity: 1;
      transform: scale(1.1);
    }

    #start-screen, #game-over-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 24px 32px;
      border-radius: 16px;
      text-align: center;
      color: white;
      pointer-events: auto; 
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 2px solid #333;
    }

    .hidden { display: none !important; }

    button {
      background-color: #f43f5e;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #be123c;
      transition: transform 0.1s;
      margin-top: 10px;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #be123c;
    }

    h2 { font-size: 2rem; color: #facc15; text-shadow: 1px 1px 0 #000; margin-bottom: 5px;}
    p { font-size: 1.1rem; color: #cbd5e1; }
    
    .score-board {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .score-board p {
      margin: 5px 0;
      font-size: 1.2rem;
      color: white;
      font-weight: bold;
    }
    .score-number { color: #facc15; font-size: 1.4rem;}
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
      <div id="score-display">0</div>
      <div id="powerup-text">¡PODER!</div>
      
      <div id="start-screen">
        <h2>Flappy Paul</h2>
        <p>Atrapa las 🌟 para Súper Poderes</p>
        <button onclick="startGame()">JUGAR</button>
      </div>

      <div id="game-over-screen" class="hidden">
        <h2>¡Game Over!</h2>
        <div class="score-board">
          <p>Puntuación: <span class="score-number" id="final-score">0</span></p>
          <p>Récord: <span class="score-number" id="best-score">0</span></p>
        </div>
        <button onclick="resetGame()">REINTENTAR</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      const container = document.getElementById("game-container");
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- VARIABLES GLOBALES ---
    let frames = 0;
    let score = 0;
    let highScore = localStorage.getItem('flappy_high_score') || 0; 
    let currentState = 'START'; 
    let animationId;
    
    let baseSpeed = 2.8;       
    let gameSpeed = baseSpeed; 
    let distanceTraveled = 0;  
    let distanceSinceLastPipe = 220; 
    
    // SISTEMA DE PODERES
    let activePowerUp = 'NONE'; // NONE, SPEED, LASER, GIANT, SCORE
    let powerUpTimer = 0;
    let shieldTimer = 0; 
    let pointsPerPipe = 1; // Cambia a 10 con el poder SCORE
    
    let coinsList = [];
    let pipesSpawnedCount = 0; 

    // --- OBJETO: BIRD (PAUL) ---
    const bird = {
      x: 60,
      y: 150,
      originalRadius: 12,
      radius: 12,
      velocity: 0,
      gravity: 0.25,
      jumpForce: -5.5,
      
      draw: function() {
        ctx.save(); 
        
        if (shieldTimer > 0) {
          ctx.globalAlpha = (frames % 10 < 5) ? 0.4 : 1; 
        }

        ctx.translate(this.x, this.y); 
        
        // Efectos de Aura según el poder
        if (activePowerUp === 'SPEED' || activePowerUp === 'SCORE') {
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + 8 + Math.random() * 4, 0, Math.PI * 2);
          ctx.fillStyle = activePowerUp === 'SPEED' ? "rgba(56, 189, 248, 0.5)" : "rgba(250, 204, 21, 0.5)"; 
          ctx.fill();
        }

        // --- NOMBRE DE PAUL ---
        ctx.fillStyle = "white";
        ctx.font = "bold " + (12 * (this.radius / this.originalRadius)) + "px Arial";
        ctx.textAlign = "center";
        ctx.strokeStyle = "black";
        ctx.lineWidth = 3;
        let nameY = -(this.radius + 10);
        ctx.strokeText("Paul", 0, nameY);
        ctx.fillText("Paul", 0, nameY);

        // Rotación dinámica al saltar/caer
        let rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
        ctx.rotate(rotation);

        // --- DIBUJAR OJOS LÁSER ---
        if (activePowerUp === 'LASER') {
          ctx.beginPath();
          ctx.moveTo(5, -5);
          ctx.lineTo(canvas.width, -5); // Dispara fuera de la pantalla
          ctx.lineWidth = 4 * (this.radius / this.originalRadius);
          ctx.strokeStyle = "red";
          ctx.stroke();
          
          ctx.beginPath();
          ctx.moveTo(5, -5);
          ctx.lineTo(canvas.width, -5);
          ctx.lineWidth = 1 * (this.radius / this.originalRadius);
          ctx.strokeStyle = "white";
          ctx.stroke();
        }

        // Si es Gigante, escalamos el dibujo
        let scale = this.radius / this.originalRadius;
        ctx.scale(scale, scale);

        ctx.lineWidth = 2;
        ctx.strokeStyle = "#000";

        // Cuerpo 
        ctx.beginPath();
        ctx.arc(0, 0, this.originalRadius, 0, Math.PI * 2);
        ctx.fillStyle = (powerUpTimer > 0) ? "#facc15" : "#fbbf24"; 
        ctx.fill();
        ctx.stroke();

        // Ojo 
        ctx.beginPath();
        ctx.arc(5, -5, 4, 0, Math.PI * 2); 
        ctx.fillStyle = activePowerUp === 'LASER' ? "red" : "white";
        ctx.fill();
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(6, -5, 1.5, 0, Math.PI * 2); 
        ctx.fillStyle = activePowerUp === 'LASER' ? "yellow" : "black";
        ctx.fill();

        // Pico 
        ctx.beginPath();
        ctx.moveTo(10, -1);
        ctx.lineTo(18, 2);
        ctx.lineTo(10, 5);
        ctx.lineTo(8, 2);
        ctx.fillStyle = "#f97316";
        ctx.fill();
        ctx.stroke();

        // Ala
        let flapOffset = (frames % 20 < 10) ? -2 : 2; 
        if (powerUpTimer > 0) flapOffset = (frames % 6 < 3) ? -3 : 3; 
        if (currentState !== 'PLAYING') flapOffset = 0;

        ctx.beginPath();
        ctx.ellipse(-4, 2 + flapOffset, 7, 4, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#fef08a"; 
        ctx.fill();
        ctx.stroke();

        ctx.restore(); 
      },
      
      update: function() {
        this.velocity += this.gravity;
        this.y += this.velocity;

        // Mantener a Paul gigante dentro de la pantalla
        if (this.y + this.radius >= canvas.height - 40) {
          this.y = canvas.height - 40 - this.radius;
          // Rebotar si hay poder o escudo temporal
          if (powerUpTimer > 0 || shieldTimer > 0) this.velocity = -7; 
          else { currentState = 'GAMEOVER'; showGameOver(); }
        }
        
        if (this.y - this.radius <= 0) {
          this.y = this.radius;
          if (powerUpTimer > 0 || shieldTimer > 0) this.velocity = 3; 
          else this.velocity = 0;
        }
      },
      jump: function() {
        this.velocity = this.jumpForce;
      }
    };

    // --- OBJETO: OBSTÁCULOS (TUBERÍAS Y MONEDAS) ---
    const obstacles = {
      items: [],
      width: 55,
      gap: 135,
      pipeSpawnDist: 220,
      
      draw: function() {
        for (let i = 0; i < this.items.length; i++) {
          let p = this.items[i];
          if (p.destroyed) continue; // No dibujar si fue destruida por Láser o Gigante

          let pipeGradient = ctx.createLinearGradient(p.x, 0, p.x + this.width, 0);
          pipeGradient.addColorStop(0, "#53a828");
          pipeGradient.addColorStop(0.2, "#74c627"); 
          pipeGradient.addColorStop(0.8, "#53a828");
          pipeGradient.addColorStop(1, "#326114"); 

          ctx.fillStyle = pipeGradient;
          ctx.strokeStyle = "#166534";
          ctx.lineWidth = 2;

          let capHeight = 20; 
          let capExtra = 6;   

          // Superior
          ctx.fillRect(p.x, 0, this.width, p.topHeight);
          ctx.strokeRect(p.x, 0, this.width, p.topHeight);
          ctx.fillRect(p.x - capExtra/2, p.topHeight - capHeight, this.width + capExtra, capHeight);
          ctx.strokeRect(p.x - capExtra/2, p.topHeight - capHeight, this.width + capExtra, capHeight);

          // Inferior
          let bottomY = p.topHeight + this.gap;
          let bottomHeight = canvas.height - bottomY - 40;
          ctx.fillRect(p.x, bottomY, this.width, bottomHeight);
          ctx.strokeRect(p.x, bottomY, this.width, bottomHeight);
          ctx.fillRect(p.x - capExtra/2, bottomY, this.width + capExtra, capHeight);
          ctx.strokeRect(p.x - capExtra/2, bottomY, this.width + capExtra, capHeight);
        }

        // Monedas
        for (let i = 0; i < coinsList.length; i++) {
          let c = coinsList[i];
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
          ctx.fillStyle = "#facc15"; 
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = "#b45309";
          ctx.stroke();

          ctx.fillStyle = "#fff";
          ctx.font = "14px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("★", c.x, c.y + 1);
        }
      },
      
      update: function() {
        distanceSinceLastPipe += gameSpeed;

        if (distanceSinceLastPipe >= this.pipeSpawnDist) {
          distanceSinceLastPipe = 0;
          
          let minHeight = 60;
          let maxHeight = canvas.height - this.gap - 40 - 60;
          let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
          
          this.items.push({ x: canvas.width, topHeight: topHeight, passed: false, destroyed: false });
          pipesSpawnedCount++;

          // AHORA CADA 7 TUBERÍAS SALE UNA MONEDA
          if (pipesSpawnedCount % 7 === 0) {
            let coinNearTop = Math.random() < 0.5;
            let coinYPosition = coinNearTop ? topHeight + 25 : topHeight + this.gap - 25;
            coinsList.push({ x: canvas.width + this.width / 2, y: coinYPosition, radius: 14 });
          }
        }

        // Colisiones con MONEDAS
        for (let i = 0; i < coinsList.length; i++) {
          let c = coinsList[i];
          c.x -= gameSpeed;

          let dx = bird.x - c.x;
          let dy = bird.y - c.y;
          let distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < bird.radius + c.radius) {
            activateRandomPowerUp();
            coinsList.splice(i, 1);
            i--;
            continue;
          }
          if (c.x < -30) { coinsList.splice(i, 1); i--; }
        }

        // Colisiones con TUBERÍAS
        for (let i = 0; i < this.items.length; i++) {
          let p = this.items[i];
          p.x -= gameSpeed;

          let bottomY = p.topHeight + this.gap;
          
          if (!p.destroyed) {
            // DESTRUCCIÓN POR LÁSER (Si la tubería está delante de Paul)
            if (activePowerUp === 'LASER' && p.x > bird.x) {
              p.destroyed = true;
            } 
            // COLISIONES FÍSICAS (Muerte o Destrucción Gigante)
            else if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + this.width) {
              if (bird.y - bird.radius < p.topHeight || bird.y + bird.radius > bottomY) {
                if (activePowerUp === 'GIANT') {
                  p.destroyed = true; // Paul gigante rompe el tubo
                } else if (powerUpTimer === 0 && shieldTimer === 0) {
                  currentState = 'GAMEOVER';
                  showGameOver();
                }
              }
            }
          }

          // Sumar puntos al pasar el área de la tubería (incluso si está destruida)
          if (p.x + this.width < bird.x && !p.passed) {
            score += pointsPerPipe;
            p.passed = true;
            document.getElementById('score-display').innerText = score;
          }

          if (p.x + this.width < -10) { this.items.shift(); i--; }
        }
      },
      reset: function() {
        this.items = [];
        coinsList = [];
        pipesSpawnedCount = 0; 
        distanceSinceLastPipe = this.pipeSpawnDist; 
      }
    };

    // --- LÓGICA DE SUPER PODERES ---
    function activateRandomPowerUp() {
      const powers = ['SPEED', 'LASER', 'GIANT', 'SCORE'];
      activePowerUp = powers[Math.floor(Math.random() * powers.length)];
      powerUpTimer = 180; // 3 Segundos
      shieldTimer = 0; 

      // Reiniciar stats base
      gameSpeed = baseSpeed;
      bird.radius = bird.originalRadius;
      pointsPerPipe = 1;
      
      let msgText = document.getElementById('powerup-text');

      if (activePowerUp === 'SPEED') {
        gameSpeed = 22; 
        msgText.innerText = "¡SÚPER VELOCIDAD!";
        msgText.style.color = "#38bdf8";
      } else if (activePowerUp === 'LASER') {
        msgText.innerText = "¡OJOS LÁSER!";
        msgText.style.color = "#ef4444";
      } else if (activePowerUp === 'GIANT') {
        bird.radius = bird.originalRadius * 4; // Tamaño x4
        // Evitar que se quede atascado en el suelo al crecer de golpe
        if (bird.y + bird.radius > canvas.height - 40) bird.y = canvas.height - 40 - bird.radius;
        msgText.innerText = "¡PAUL GIGANTE!";
        msgText.style.color = "#4ade80";
      } else if (activePowerUp === 'SCORE') {
        pointsPerPipe = 10;
        msgText.innerText = "¡PUNTAJE X10!";
        msgText.style.color = "#facc15";
      }

      msgText.classList.add('show');
      document.getElementById('score-display').classList.add('powerup');
    }

    function updatePowerUp() {
      // Ocultar mensaje flotante después de 1 segundo
      if (powerUpTimer === 120) {
        document.getElementById('powerup-text').classList.remove('show');
      }

      if (powerUpTimer > 0) {
        powerUpTimer--;
        
        if (powerUpTimer === 0) {
          // TERMINA EL PODER
          gameSpeed = baseSpeed;
          bird.radius = bird.originalRadius;
          pointsPerPipe = 1;
          activePowerUp = 'NONE';

          document.getElementById('score-display').classList.remove('powerup');
          
          obstacles.items = []; // Limpiamos la pantalla por seguridad
          distanceSinceLastPipe = 0; 
          shieldTimer = 90; // Modo fantasma activado
        }
      }
      
      if (shieldTimer > 0) shieldTimer--;
    }

    // --- FUNCIONES DE SUELO ---
    function drawGround() {
      distanceTraveled += gameSpeed;

      ctx.fillStyle = varColor('--ground-color', '#ded895');
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      
      ctx.fillStyle = "#84cc3a";
      ctx.fillRect(0, canvas.height - 40, canvas.width, 12);
      ctx.strokeStyle = "#538d1e";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 40);
      ctx.lineTo(canvas.width, canvas.height - 40);
      ctx.stroke();

      let moveOffset = distanceTraveled % 20;
      ctx.beginPath();
      for(let i = 0; i < canvas.width + 20; i+= 20) {
        ctx.moveTo(i - moveOffset, canvas.height - 40);
        ctx.lineTo(i - moveOffset - 10, canvas.height - 28);
      }
      ctx.strokeStyle = "rgba(0,0,0,0.1)";
      ctx.stroke();
    }

    // --- BUCLE PRINCIPAL ---
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentState === 'PLAYING') {
        updatePowerUp();
        bird.update();
        obstacles.update();
      }

      obstacles.draw();
      drawGround();
      bird.draw();

      if (currentState === 'PLAYING') {
        frames++;
        animationId = requestAnimationFrame(loop);
      }
    }

    // --- CONTROL DE ESTADOS ---
    function startGame() {
      document.getElementById('start-screen').classList.add('hidden');
      currentState = 'PLAYING';
      bird.jump(); 
      loop();
    }

    function showGameOver() {
      document.getElementById('game-over-screen').classList.remove('hidden');
      document.getElementById('powerup-text').classList.remove('show');
      
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('flappy_high_score', highScore);
      }

      document.getElementById('final-score').innerText = score;
      document.getElementById('best-score').innerText = highScore;
    }

    function resetGame() {
      document.getElementById('game-over-screen').classList.add('hidden');
      
      bird.y = 150;
      bird.velocity = 0;
      bird.radius = bird.originalRadius;
      obstacles.reset();
      
      score = 0;
      frames = 0;
      distanceTraveled = 0;
      
      powerUpTimer = 0;
      shieldTimer = 0; 
      gameSpeed = baseSpeed;
      pointsPerPipe = 1;
      activePowerUp = 'NONE';
      
      document.getElementById('score-display').innerText = score;
      document.getElementById('score-display').classList.remove('powerup');
      
      currentState = 'PLAYING';
      bird.jump();
      loop();
    }

    // --- CONTROLES ---
    function handleInput(e) {
      if(e.type === 'touchstart') e.preventDefault(); 
      if (currentState === 'PLAYING') bird.jump();
    }

    canvas.addEventListener("touchstart", handleInput, {passive: false});
    canvas.addEventListener("mousedown", handleInput);
    
    document.addEventListener("keydown", function(e) {
      if (e.code === "Space") {
        if (currentState === 'START') startGame();
        else if (currentState === 'PLAYING') bird.jump();
        else if (currentState === 'GAMEOVER') resetGame();
      }
    });

    function varColor(name, fallback) {
      const style = getComputedStyle(document.body);
      return style.getPropertyValue(name).trim() || fallback;
    }

    drawGround();
    bird.draw();

    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('touchmove', function(event) {
      if (event.scale && event.scale !== 1) { event.preventDefault(); }
    }, { passive: false });

  </script>
</body>
</html>
