<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Paul - Edición Locura Total</title>
  <style>
    :root {
      --bg-color: #70c5ce; 
      --ground-color: #ded895;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #121212; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none; 
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 400px; 
      height: 100%;
      max-height: 600px;
      background-color: var(--bg-color);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #score-display {
      font-size: 4rem;
      font-weight: bold;
      color: var(--text-color);
      margin-top: 15%;
      text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      z-index: 10;
      transition: color 0.2s, transform 0.2s;
    }

    #score-display.powerup {
      color: #facc15;
      transform: scale(1.2);
    }

    /* TEXTO DEL SUPER PODER FLOTANTE */
    #powerup-text {
      position: absolute;
      top: 35%;
      font-size: 1.8rem;
      font-weight: 900;
      color: #facc15;
      text-shadow: 3px 3px 0 #000;
      text-align: center;
      z-index: 20;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.2s ease-out;
    }

    #powerup-text.show {
      opacity: 1;
      transform: scale(1.1);
    }

    /* Botón de Música */
    #mute-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.4);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      width: 45px;
      height: 45px;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 30;
      pointer-events: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s;
    }
    
    #mute-btn:hover { background: rgba(0, 0, 0, 0.7); }

    #start-screen, #game-over-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 24px 32px;
      border-radius: 16px;
      text-align: center;
      color: white;
      pointer-events: auto; 
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 2px solid #333;
    }

    .hidden { display: none !important; }

    button.action-btn {
      background-color: #f43f5e;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #be123c;
      transition: transform 0.1s;
      margin-top: 10px;
    }

    button.action-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #be123c;
    }

    h2 { font-size: 2rem; color: #facc15; text-shadow: 1px 1px 0 #000; margin-bottom: 5px;}
    p { font-size: 1.1rem; color: #cbd5e1; }
    
    .score-board {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .score-board p {
      margin: 5px 0;
      font-size: 1.2rem;
      color: white;
      font-weight: bold;
    }
    .score-number { color: #facc15; font-size: 1.4rem;}
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
      <button id="mute-btn" onclick="toggleMute()">🔊</button>

      <div id="score-display">0</div>
      <div id="powerup-text">¡PODER!</div>
      
      <div id="start-screen">
        <h2>Flappy Paul</h2>
        <p>Atrapa las 🌟 para Súper Poderes</p>
        <button class="action-btn" onclick="startGame()">JUGAR</button>
      </div>

      <div id="game-over-screen" class="hidden">
        <h2>¡Game Over!</h2>
        <div class="score-board">
          <p>Puntuación: <span class="score-number" id="final-score">0</span></p>
          <p>Récord: <span class="score-number" id="best-score">0</span></p>
        </div>
        <button class="action-btn" onclick="resetGame()">REINTENTAR</button>
      </div>
    </div>
  </div>

  <script>
    // --- REPRODUCTOR DE MÚSICA MP3 ---
    const bgMusic = new Audio("Artista Desconocido - Flappy Bird Theme Song.mp3");
    bgMusic.loop = true; // Hace que la canción se repita infinitamente
    let isMuted = false;

    function toggleMute() {
      isMuted = !isMuted;
      bgMusic.muted = isMuted;
      document.getElementById('mute-btn').innerText = isMuted ? "🔇" : "🔊";
      
      // Si desmuteamos en medio de la partida, que empiece a sonar
      if (!isMuted && currentState === 'PLAYING') {
        bgMusic.play().catch(e => console.log("Esperando interacción..."));
      }
    }

    function playMusic() {
      if (!isMuted) {
        bgMusic.play().catch(e => console.log("Esperando interacción del usuario..."));
      }
    }

    function stopMusic() {
      bgMusic.pause();
      bgMusic.currentTime = 0; // Reiniciar la canción al principio
    }

    // --- CONFIGURACIÓN DEL CANVAS ---
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      const container = document.getElementById("game-container");
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- VARIABLES GLOBALES ---
    let frames = 0;
    let score = 0;
    let highScore = localStorage.getItem('flappy_high_score') || 0; 
    let currentState = 'START'; 
    let animationId;
    
    let baseSpeed = 2.8;       
    let gameSpeed = baseSpeed; 
    let distanceTraveled = 0;  
    let bgOffset = 0; 
    let distanceSinceLastPipe = 220; 
    
    // Nubes
    let clouds = [
      {x: 100, y: 80, speed: 0.3, size: 25},
      {x: 250, y: 140, speed: 0.5, size: 20},
      {x: 400, y: 60, speed: 0.2, size: 30}
    ];

    // SISTEMA DE PODERES
    let activePowerUp = 'NONE'; 
    let powerUpTimer = 0;
    let shieldTimer = 0; 
    let pointsPerPipe = 1; 
    let hasBubbleShield = false; 
    
    let powerBag = [];

    function getNextPowerUp() {
      if (powerBag.length === 0) {
        powerBag = ['SPEED', 'LASER', 'GIANT', 'SCORE', 'MINI', 'SLOWMO', 'SHIELD', 'MAGNET'];
        powerBag.sort(() => Math.random() - 0.5); 
      }
      return powerBag.pop(); 
    }

    let coinsList = [];
    let pipesSpawnedCount = 0; 

    // --- OBJETO: BIRD (PAUL) ---
    const bird = {
      x: 60,
      y: 150,
      originalRadius: 12,
      radius: 12,
      velocity: 0,
      gravity: 0.25,
      jumpForce: -5.5,
      
      draw: function() {
        ctx.save(); 
        
        if (shieldTimer > 0) ctx.globalAlpha = (frames % 10 < 5) ? 0.4 : 1; 

        ctx.translate(this.x, this.y); 
        
        if (activePowerUp === 'SPEED' || activePowerUp === 'SCORE') {
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + 8 + Math.random() * 4, 0, Math.PI * 2);
          ctx.fillStyle = activePowerUp === 'SPEED' ? "rgba(56, 189, 248, 0.5)" : "rgba(250, 204, 21, 0.5)"; 
          ctx.fill();
        }

        if (hasBubbleShield) {
          ctx.beginPath();
          ctx.arc(0, 0, this.originalRadius * 1.8 + Math.random() * 2, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(167, 243, 208, 0.4)"; 
          ctx.fill();
          ctx.strokeStyle = "rgba(52, 211, 153, 0.8)";
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        if (activePowerUp === 'MAGNET') {
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + 10 + (frames % 20), 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(236, 72, 153, ${1 - (frames % 20)/20})`; 
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        ctx.fillStyle = "white";
        ctx.font = "bold " + (12 * (this.radius / this.originalRadius)) + "px Arial";
        ctx.textAlign = "center";
        ctx.strokeStyle = "black";
        ctx.lineWidth = 3;
        let nameY = -(this.radius + 12);
        ctx.strokeText("Paul", 0, nameY);
        ctx.fillText("Paul", 0, nameY);

        let rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
        ctx.rotate(rotation);

        if (activePowerUp === 'LASER') {
          ctx.beginPath();
          ctx.moveTo(5, -5);
          ctx.lineTo(150, -5); 
          ctx.lineWidth = 4 * (this.radius / this.originalRadius);
          ctx.strokeStyle = "red";
          ctx.stroke();
          
          ctx.beginPath();
          ctx.moveTo(5, -5);
          ctx.lineTo(150, -5);
          ctx.lineWidth = 1 * (this.radius / this.originalRadius);
          ctx.strokeStyle = "white";
          ctx.stroke();
        }

        let scale = this.radius / this.originalRadius;
        ctx.scale(scale, scale);

        ctx.lineWidth = 2;
        ctx.strokeStyle = "#000";

        ctx.beginPath();
        ctx.arc(0, 0, this.originalRadius, 0, Math.PI * 2);
        ctx.fillStyle = (powerUpTimer > 0) ? "#facc15" : "#fbbf24"; 
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(5, -5, 4, 0, Math.PI * 2); 
        ctx.fillStyle = activePowerUp === 'LASER' ? "red" : "white";
        ctx.fill();
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(6, -5, 1.5, 0, Math.PI * 2); 
        ctx.fillStyle = activePowerUp === 'LASER' ? "yellow" : "black";
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(10, -1);
        ctx.lineTo(18, 2);
        ctx.lineTo(10, 5);
        ctx.lineTo(8, 2);
        ctx.fillStyle = "#f97316";
        ctx.fill();
        ctx.stroke();

        let flapOffset = (frames % 20 < 10) ? -2 : 2; 
        if (powerUpTimer > 0) flapOffset = (frames % 6 < 3) ? -3 : 3; 
        if (activePowerUp === 'SLOWMO') flapOffset = (frames %
