<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Bird Clon - Edición Poderes</title>
  <style>
    :root {
      --bg-color: #70c5ce; 
      --ground-color: #ded895;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #121212; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none; 
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 400px; 
      height: 100%;
      max-height: 600px;
      background-color: var(--bg-color);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Interfaz de usuario superpuesta */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #score-display {
      font-size: 4rem;
      font-weight: bold;
      color: var(--text-color);
      margin-top: 15%;
      text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      z-index: 10;
      transition: color 0.2s, transform 0.2s;
    }

    /* Efecto cuando estamos en modo super velocidad */
    #score-display.powerup {
      color: #38bdf8;
      transform: scale(1.2);
    }

    #start-screen, #game-over-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 24px 32px;
      border-radius: 16px;
      text-align: center;
      color: white;
      pointer-events: auto; 
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 2px solid #333;
    }

    .hidden { display: none !important; }

    button {
      background-color: #f43f5e;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #be123c;
      transition: transform 0.1s;
      margin-top: 10px;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #be123c;
    }

    h2 { font-size: 2rem; color: #facc15; text-shadow: 1px 1px 0 #000; margin-bottom: 5px;}
    p { font-size: 1.1rem; color: #cbd5e1; }
    
    .score-board {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .score-board p {
      margin: 5px 0;
      font-size: 1.2rem;
      color: white;
      font-weight: bold;
    }
    .score-number { color: #facc15; font-size: 1.4rem;}
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
      <div id="score-display">0</div>
      
      <div id="start-screen">
        <h2>Flappy Clon</h2>
        <p>Atrapa las 🌟 para Súper Velocidad</p>
        <button onclick="startGame()">JUGAR</button>
      </div>

      <div id="game-over-screen" class="hidden">
        <h2>¡Game Over!</h2>
        <div class="score-board">
          <p>Puntuación: <span class="score-number" id="final-score">0</span></p>
          <p>Récord: <span class="score-number" id="best-score">0</span></p>
        </div>
        <button onclick="resetGame()">REINTENTAR</button>
      </div>
    </div>
  </div>

  <script>
    // --- CONFIGURACIÓN DEL CANVAS ---
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      const container = document.getElementById("game-container");
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- VARIABLES GLOBALES DEL JUEGO ---
    let frames = 0;
    let score = 0;
    let highScore = localStorage.getItem('flappy_high_score') || 0; 
    let currentState = 'START'; 
    let animationId;
    
    // Control de Velocidad y Distancia
    let baseSpeed = 2.8;       // Velocidad normal de los obstáculos
    let gameSpeed = baseSpeed; // Velocidad actual (cambia con el poder)
    let distanceTraveled = 0;  // Para el efecto de suelo en movimiento
    let distanceSinceLastPipe = 220; // Contador para saber cuándo crear otro tubo
    
    // Control del Power-Up (Moneda)
    let powerUpTimer = 0;
    let coinsList = [];

    // --- OBJETOS DEL JUEGO ---
    const bird = {
      x: 60,
      y: 150,
      radius: 12,
      velocity: 0,
      gravity: 0.25,
      jumpForce: -5.5,
      
      draw: function() {
        ctx.save(); 
        ctx.translate(this.x, this.y); 
        
        // Aura invencible si el poder está activo
        if (powerUpTimer > 0) {
          ctx.beginPath();
          ctx.arc(0, 0, this.radius + 8 + Math.random() * 4, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(56, 189, 248, 0.5)"; // Aura Celeste brillante
          ctx.fill();
        }

        let rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
        ctx.rotate(rotation);

        ctx.lineWidth = 2;
        ctx.strokeStyle = "#000";

        // Cuerpo 
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = (powerUpTimer > 0) ? "#facc15" : "#fbbf24"; // Más brillante si tiene poder
        ctx.fill();
        ctx.stroke();

        // Ojo 
        ctx.beginPath();
        ctx.arc(5, -5, 4, 0, Math.PI * 2); 
        ctx.fillStyle = "white";
        ctx.fill();
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(6, -5, 1.5, 0, Math.PI * 2); 
        ctx.fillStyle = "black";
        ctx.fill();

        // Pico 
        ctx.beginPath();
        ctx.moveTo(10, -1);
        ctx.lineTo(18, 2);
        ctx.lineTo(10, 5);
        ctx.lineTo(8, 2);
        ctx.fillStyle = "#f97316";
        ctx.fill();
        ctx.stroke();

        // Ala animada
        let flapOffset = (frames % 20 < 10) ? -2 : 2; 
        if (powerUpTimer > 0) flapOffset = (frames % 6 < 3) ? -3 : 3; // Aleteo más rápido con poder
        if (currentState !== 'PLAYING') flapOffset = 0;

        ctx.beginPath();
        ctx.ellipse(-4, 2 + flapOffset, 7, 4, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#fef08a"; 
        ctx.fill();
        ctx.stroke();

        ctx.restore(); 
      },
      
      update: function() {
        this.velocity += this.gravity;
        this.y += this.velocity;

        // Si tenemos el super poder activado, REBOTAMOS en los bordes en lugar de morir
        if (powerUpTimer > 0) {
          if (this.y + this.radius >= canvas.height - 40) {
            this.y = canvas.height - 40 - this.radius;
            this.velocity = -7; // Super rebote en el suelo
          }
          if (this.y - this.radius <= 0) {
            this.y = this.radius;
            this.velocity = 3; // Rebote en el techo
          }
        } 
        // Lógica de muerte normal si no tenemos poder
        else {
          if (this.y + this.radius >= canvas.height - 40) {
            this.y = canvas.height - 40 - this.radius;
            currentState = 'GAMEOVER';
            showGameOver();
          }
          if (this.y - this.radius <= 0) {
            this.y = this.radius;
            this.velocity = 0;
          }
        }
      },
      jump: function() {
        this.velocity = this.jumpForce;
      }
    };

    const obstacles = {
      items: [],
      width: 55,
      gap: 135,
      pipeSpawnDist: 220, // Distancia entre tubo y tubo
      
      draw: function() {
        // DIBUJAR TUBERÍAS
        for (let i = 0; i < this.items.length; i++) {
          let p = this.items[i];
          
          let pipeGradient = ctx.createLinearGradient(p.x, 0, p.x + this.width, 0);
          pipeGradient.addColorStop(0, "#53a828");
          pipeGradient.addColorStop(0.2, "#74c627"); 
          pipeGradient.addColorStop(0.8, "#53a828");
          pipeGradient.addColorStop(1, "#326114"); 

          ctx.fillStyle = pipeGradient;
          ctx.strokeStyle = "#166534";
          ctx.lineWidth = 2;

          let capHeight = 20; 
          let capExtra = 6;   

          // Tubo Superior
          ctx.fillRect(p.x, 0, this.width, p.topHeight);
          ctx.strokeRect(p.x, 0, this.width, p.topHeight);
          ctx.fillRect(p.x - capExtra/2, p.topHeight - capHeight, this.width + capExtra, capHeight);
          ctx.strokeRect(p.x - capExtra/2, p.topHeight - capHeight, this.width + capExtra, capHeight);

          // Tubo Inferior
          let bottomY = p.topHeight + this.gap;
          let bottomHeight = canvas.height - bottomY - 40;
          
          ctx.fillRect(p.x, bottomY, this.width, bottomHeight);
          ctx.strokeRect(p.x, bottomY, this.width, bottomHeight);
          ctx.fillRect(p.x - capExtra/2, bottomY, this.width + capExtra, capHeight);
          ctx.strokeRect(p.x - capExtra/2, bottomY, this.width + capExtra, capHeight);
        }

        // DIBUJAR MONEDAS
        for (let i = 0; i < coinsList.length; i++) {
          let c = coinsList[i];
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
          ctx.fillStyle = "#facc15"; // Dorado
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = "#b45309"; // Borde bronce
          ctx.stroke();

          // Estrella en la moneda
          ctx.fillStyle = "#fff";
          ctx.font = "14px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("★", c.x, c.y + 1);
        }
      },
      
      update: function() {
        distanceSinceLastPipe += gameSpeed;

        // Generar nuevos obstáculos basados en distancia (independiente de la velocidad)
        if (distanceSinceLastPipe >= this.pipeSpawnDist) {
          distanceSinceLastPipe = 0;

          let minHeight = 60;
          let maxHeight = canvas.height - this.gap - 40 - 60;
          let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
          
          this.items.push({
            x: canvas.width,
            topHeight: topHeight,
            passed: false 
          });

          // 30% DE PROBABILIDAD DE CREAR UNA MONEDA EN EL CENTRO DEL HUECO
          if (Math.random() < 0.30) {
            coinsList.push({
              x: canvas.width + this.width / 2,
              y: topHeight + (this.gap / 2),
              radius: 14
            });
          }
        }

        // Actualizar y comprobar colisiones con MONEDAS
        for (let i = 0; i < coinsList.length; i++) {
          let c = coinsList[i];
          c.x -= gameSpeed;

          // Colisión Pájaro -> Moneda
          let dx = bird.x - c.x;
          let dy = bird.y - c.y;
          let distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < bird.radius + c.radius) {
            // ¡ATRAPÓ LA MONEDA! Activar Super Poder
            activatePowerUp();
            coinsList.splice(i, 1);
            i--;
            continue;
          }

          // Eliminar si sale de pantalla
          if (c.x < -30) {
            coinsList.splice(i, 1);
            i--;
          }
        }

        // Actualizar y comprobar colisiones con TUBERÍAS
        for (let i = 0; i < this.items.length; i++) {
          let p = this.items[i];
          p.x -= gameSpeed;

          let bottomY = p.topHeight + this.gap;
          
          // ¡SOLO MUERE SI NO TIENE EL SUPER PODER ACTIVO!
          if (powerUpTimer === 0) {
            if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + this.width) {
              if (bird.y - bird.radius < p.topHeight || bird.y + bird.radius > bottomY) {
                currentState = 'GAMEOVER';
                showGameOver();
              }
            }
          }

          // Aumentar puntuación (funciona sin importar a qué velocidad vayamos)
          if (p.x + this.width < bird.x && !p.passed) {
            score++;
            p.passed = true;
            document.getElementById('score-display').innerText = score;
          }

          // Eliminar tubos fuera de pantalla
          if (p.x + this.width < -10) {
            this.items.shift();
            i--; 
          }
        }
      },
      reset: function() {
        this.items = [];
        coinsList = [];
        distanceSinceLastPipe = this.pipeSpawnDist; // Para que spawnee uno de inmediato
      }
    };

    // --- LÓGICA DE SUPER PODERES ---
    function activatePowerUp() {
      powerUpTimer = 180; // Dura aprox 3 segundos (a 60fps)
      gameSpeed = 22; // Multiplicamos la velocidad x8 (Velocidad absurda pero controlable)
      document.getElementById('score-display').classList.add('powerup');
    }

    function updatePowerUp() {
      if (powerUpTimer > 0) {
        powerUpTimer--;
        if (powerUpTimer === 0) {
          // Se acabó el poder, regresamos a la normalidad
          gameSpeed = baseSpeed;
          document.getElementById('score-display').classList.remove('powerup');
        }
      }
    }

    // --- FUNCIONES DE DIBUJO ---
    function drawGround() {
      distanceTraveled += gameSpeed;

      ctx.fillStyle = varColor('--ground-color', '#ded895');
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      
      // Franja de pasto
      ctx.fillStyle = "#84cc3a";
      ctx.fillRect(0, canvas.height - 40, canvas.width, 12);
      ctx.strokeStyle = "#538d1e";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 40);
      ctx.lineTo(canvas.width, canvas.height - 40);
      ctx.stroke();

      // Efecto de movimiento en el suelo sincronizado con la velocidad real
      let moveOffset = distanceTraveled % 20;
      ctx.beginPath();
      for(let i = 0; i < canvas.width + 20; i+= 20) {
        ctx.moveTo(i - moveOffset, canvas.height - 40);
        ctx.lineTo(i - moveOffset - 10, canvas.height - 28);
      }
      ctx.strokeStyle = "rgba(0,0,0,0.1)";
      ctx.stroke();
    }

    // --- BUCLE PRINCIPAL ---
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentState === 'PLAYING') {
        updatePowerUp();
        bird.update();
        obstacles.update();
      }

      obstacles.draw();
      drawGround();
      bird.draw();

      if (currentState === 'PLAYING') {
        frames++;
        animationId = requestAnimationFrame(loop);
      }
    }

    // --- CONTROL DE ESTADOS ---
    function startGame() {
      document.getElementById('start-screen').classList.add('hidden');
      currentState = 'PLAYING';
      bird.jump(); 
      loop();
    }

    function showGameOver() {
      document.getElementById('game-over-screen').classList.remove('hidden');
      
      // Lógica de Puntuación Máxima (Récord)
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('flappy_high_score', highScore);
      }

      document.getElementById('final-score').innerText = score;
      document.getElementById('best-score').innerText = highScore;
    }

    function resetGame() {
      document.getElementById('game-over-screen').classList.add('hidden');
      
      bird.y = 150;
      bird.velocity = 0;
      obstacles.reset();
      score = 0;
      frames = 0;
      distanceTraveled = 0;
      powerUpTimer = 0;
      gameSpeed = baseSpeed;
      
      document.getElementById('score-display').innerText = score;
      document.getElementById('score-display').classList.remove('powerup');
      
      currentState = 'PLAYING';
      bird.jump();
      loop();
    }

    // --- CONTROLES (Toque, Clic y Teclado) ---
    function handleInput(e) {
      if(e.type === 'touchstart') e.preventDefault(); 
      if (currentState === 'PLAYING') bird.jump();
    }

    canvas.addEventListener("touchstart", handleInput, {passive: false});
    canvas.addEventListener("mousedown", handleInput);
    
    document.addEventListener("keydown", function(e) {
      if (e.code === "Space") {
        if (currentState === 'START') startGame();
        else if (currentState === 'PLAYING') bird.jump();
        else if (currentState === 'GAMEOVER') resetGame();
      }
    });

    function varColor(name, fallback) {
      const style = getComputedStyle(document.body);
      return style.getPropertyValue(name).trim() || fallback;
    }

    // Dibujar el estado inicial antes de jugar
    drawGround();
    bird.draw();

    // Bloqueo de Zoom iOS
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('touchmove', function(event) {
      if (event.scale && event.scale !== 1) { event.preventDefault(); }
    }, { passive: false });

  </script>
</body>
</html>
