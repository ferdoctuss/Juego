<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Bird Clon</title>
  <style>
    :root {
      --bg-color: #70c5ce; /* Color del cielo del juego original */
      --ground-color: #ded895;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #121212; /* Fondo oscuro fuera del juego */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none; /* Bloquea cualquier gesto del navegador (scroll, zoom) */
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 400px; /* Ancho máximo para que se vea bien en PC */
      height: 100%;
      max-height: 600px;
      background-color: var(--bg-color);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Interfaz de usuario superpuesta */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* Para que los toques pasen al canvas */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #score-display {
      font-size: 3rem;
      font-weight: bold;
      color: var(--text-color);
      margin-top: 15%;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      z-index: 10;
    }

    #start-screen, #game-over-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 20px 30px;
      border-radius: 12px;
      text-align: center;
      color: white;
      pointer-events: auto; /* Permite hacer clic en el botón */
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .hidden {
      display: none !important;
    }

    button {
      background-color: #f43f5e;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #be123c;
      transition: transform 0.1s;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #be123c;
    }

    h2 { font-size: 1.8rem; }
    p { font-size: 1rem; color: #cbd5e1; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
      <div id="score-display">0</div>
      
      <div id="start-screen">
        <h2>Flappy Clon</h2>
        <p>Toca la pantalla o usa la barra espaciadora para saltar.</p>
        <button onclick="startGame()">JUGAR</button>
      </div>

      <div id="game-over-screen" class="hidden">
        <h2>¡Game Over!</h2>
        <p>Puntuación final: <span id="final-score">0</span></p>
        <button onclick="resetGame()">REINTENTAR</button>
      </div>
    </div>
  </div>

  <script>
    // --- CONFIGURACIÓN DEL CANVAS ---
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Ajustar el tamaño del canvas a su contenedor
    function resizeCanvas() {
      const container = document.getElementById("game-container");
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- VARIABLES DEL JUEGO ---
    let frames = 0;
    let score = 0;
    let currentState = 'START'; // START, PLAYING, GAMEOVER
    let animationId;

    // --- OBJETOS DEL JUEGO ---
    const bird = {
      x: 50,
      y: 150,
      radius: 12,
      velocity: 0,
      gravity: 0.25,
      jumpForce: -5.5,
      draw: function() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#fbbf24"; // Color amarillo (pájaro)
        ctx.fill();
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.closePath();

        // Pequeño "ojo" para darle dirección
        ctx.beginPath();
        ctx.arc(this.x + 4, this.y - 4, 2, 0, Math.PI * 2);
        ctx.fillStyle = "#000";
        ctx.fill();
        ctx.closePath();
      },
      update: function() {
        this.velocity += this.gravity;
        this.y += this.velocity;

        // Choque con el suelo
        if (this.y + this.radius >= canvas.height - 40) {
          this.y = canvas.height - 40 - this.radius;
          currentState = 'GAMEOVER';
          showGameOver();
        }
        // Choque con el techo
        if (this.y - this.radius <= 0) {
          this.y = this.radius;
          this.velocity = 0;
        }
      },
      jump: function() {
        this.velocity = this.jumpForce;
      }
    };

    const pipes = {
      items: [],
      width: 50,
      gap: 130, // Espacio entre tubo superior e inferior
      dx: 2.5,  // Velocidad a la que se mueven
      
      draw: function() {
        for (let i = 0; i < this.items.length; i++) {
          let p = this.items[i];
          
          ctx.fillStyle = "#4ade80"; // Verde (tubos)
          ctx.strokeStyle = "#166534"; // Borde verde oscuro
          ctx.lineWidth = 2;

          // Tubo Superior
          ctx.fillRect(p.x, 0, this.width, p.topHeight);
          ctx.strokeRect(p.x, 0, this.width, p.topHeight);

          // Tubo Inferior
          let bottomY = p.topHeight + this.gap;
          let bottomHeight = canvas.height - bottomY - 40; // 40 es la altura del suelo
          ctx.fillRect(p.x, bottomY, this.width, bottomHeight);
          ctx.strokeRect(p.x, bottomY, this.width, bottomHeight);
        }
      },
      
      update: function() {
        // Generar un tubo nuevo cada 90 frames
        if (frames % 90 === 0) {
          // Altura aleatoria para el tubo superior
          let minHeight = 50;
          let maxHeight = canvas.height - this.gap - 40 - 50;
          let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
          
          this.items.push({
            x: canvas.width,
            topHeight: topHeight,
            passed: false // Para saber si ya nos dio punto
          });
        }

        for (let i = 0; i < this.items.length; i++) {
          let p = this.items[i];
          p.x -= this.dx;

          // Detección de colisiones
          let bottomY = p.topHeight + this.gap;
          
          // Verificar si el pájaro está dentro del área X del tubo
          if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + this.width) {
            // Verificar si golpea el tubo de arriba o el de abajo
            if (bird.y - bird.radius < p.topHeight || bird.y + bird.radius > bottomY) {
              currentState = 'GAMEOVER';
              showGameOver();
            }
          }

          // Aumentar puntuación cuando pasamos el tubo
          if (p.x + this.width < bird.x && !p.passed) {
            score++;
            p.passed = true;
            document.getElementById('score-display').innerText = score;
          }

          // Eliminar tubos que salen de la pantalla por la izquierda para ahorrar memoria
          if (p.x + this.width < 0) {
            this.items.shift();
            i--; // Ajustar el índice tras eliminar
          }
        }
      },
      reset: function() {
        this.items = [];
      }
    };

    // --- FUNCIONES DE DIBUJO ---
    function drawGround() {
      ctx.fillStyle = varColor('--ground-color', '#ded895');
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      
      // Raya decorativa del suelo
      ctx.fillStyle = "#84cc3a";
      ctx.fillRect(0, canvas.height - 40, canvas.width, 10);
      ctx.strokeStyle = "#538d1e";
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 40);
      ctx.lineTo(canvas.width, canvas.height - 40);
      ctx.stroke();
    }

    // --- BUCLE PRINCIPAL ---
    function loop() {
      // Limpiar lienzo
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentState === 'PLAYING') {
        bird.update();
        pipes.update();
      }

      pipes.draw();
      drawGround();
      bird.draw();

      if (currentState === 'PLAYING') {
        frames++;
        animationId = requestAnimationFrame(loop);
      }
    }

    // --- CONTROL DE ESTADOS ---
    function startGame() {
      document.getElementById('start-screen').classList.add('hidden');
      currentState = 'PLAYING';
      bird.jump(); // Pequeño salto inicial
      loop();
    }

    function showGameOver() {
      document.getElementById('game-over-screen').classList.remove('hidden');
      document.getElementById('final-score').innerText = score;
    }

    function resetGame() {
      document.getElementById('game-over-screen').classList.add('hidden');
      
      // Reiniciar variables
      bird.y = 150;
      bird.velocity = 0;
      pipes.reset();
      score = 0;
      frames = 0;
      document.getElementById('score-display').innerText = score;
      
      currentState = 'PLAYING';
      bird.jump();
      loop();
    }

    // --- CONTROLES (Toque, Clic y Teclado) ---
    function handleInput(e) {
      // Evitamos el comportamiento por defecto (como hacer scroll) si tocamos el canvas
      if(e.type === 'touchstart') e.preventDefault(); 
      
      if (currentState === 'PLAYING') {
        bird.jump();
      } else if (currentState === 'GAMEOVER') {
        // Prevenir que el juego se reinicie accidentalmente en el mismo toque que mueres
      }
    }

    // Eventos
    canvas.addEventListener("touchstart", handleInput, {passive: false});
    canvas.addEventListener("mousedown", handleInput);
    
    document.addEventListener("keydown", function(e) {
      if (e.code === "Space") {
        if (currentState === 'START') startGame();
        else if (currentState === 'PLAYING') bird.jump();
        else if (currentState === 'GAMEOVER') resetGame();
      }
    });

    // Helper para leer colores CSS
    function varColor(name, fallback) {
      const style = getComputedStyle(document.body);
      return style.getPropertyValue(name).trim() || fallback;
    }

    // Dibujar el estado inicial (antes de dar a jugar)
    drawGround();
    bird.draw();

    // --- BLOQUEO DE ZOOM TÁCTIL ESTRICTO PARA IOS/ANDROID ---
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('touchmove', function(event) {
      if (event.scale && event.scale !== 1) { event.preventDefault(); }
    }, { passive: false });

  </script>
</body>
</html>
